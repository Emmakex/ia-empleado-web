<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">IA Empleado</title>
  <desc id="desc">Tres nodos conectados en un círculo representan personas, IA y sistemas trabajando como un solo equipo.</desc>
  <defs>
    <linearGradient id="brand" x1="15" y1="10" x2="82" y2="87" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C83FF"/>
      <stop offset="0.52" stop-color="#5B5FF5"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round">
    <path d="M48 15A33 33 0 0 1 79 59"/>
    <path d="M73 70A33 33 0 0 1 23 70"/>
    <path d="M17 59A33 33 0 0 1 40 16"/>
  </g>
  <g fill="url(#brand)" filter="url(#glow)">
    <circle cx="48" cy="14" r="9"/>
    <circle cx="79" cy="67" r="9"/>
    <circle cx="17" cy="67" r="9"/>
  </g>
  <circle cx="48" cy="48" r="7" fill="#ffffff" stroke="#E7E9FF" stroke-width="2"/>
</svg>