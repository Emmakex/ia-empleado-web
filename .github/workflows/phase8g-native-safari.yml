name: Phase 8G Native Safari macOS

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "content/growth/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  push:
    branches: [main]
    paths-ignore:
      - "content/growth/**"
  workflow_dispatch:

concurrency:
  group: phase8g-native-safari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-safari:
    name: Native Safari acceptance
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build exact candidate
        run: npm run build

      - name: Start exact candidate
        run: |
          npm run start -- -p 3100 > /tmp/ia-empleado-safari-next.log 2>&1 &
          echo $! > /tmp/ia-empleado-safari-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ia-empleado-safari-next.log
          exit 1

      - name: Record macOS and native Safari versions
        run: |
          mkdir -p artifacts/native-safari
          sw_vers | tee artifacts/native-safari/macos-version.txt
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString | tee artifacts/native-safari/safari-version.txt
          /usr/bin/safaridriver --version | tee artifacts/native-safari/safaridriver-version.txt

      - name: Enable native Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable

      - name: Enable full keyboard navigation for Safari acceptance
        run: |
          defaults write NSGlobalDomain AppleKeyboardUIMode -int 2
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true
          defaults write com.apple.Safari com.apple.Safari.ContentPageGroupIdentifier.WebKit2TabsToLinks -bool true
          killall cfprefsd || true
          sleep 3
          defaults read NSGlobalDomain AppleKeyboardUIMode | tee artifacts/native-safari/keyboard-navigation-setting.txt
          defaults read com.apple.Safari WebKitTabToLinksPreferenceKey | tee artifacts/native-safari/safari-tab-navigation-setting.txt

      - name: Install Selenium client in isolated environment
        run: |
          python3 -m venv .venv-safari
          . .venv-safari/bin/activate
          python -m pip install --disable-pip-version-check --quiet "selenium>=4.30,<5"

      - name: Run native Safari Phase 8G smoke
        env:
          BASE_URL: http://127.0.0.1:3100
          SAFARI_ARTIFACT_DIR: artifacts/native-safari
        run: |
          . .venv-safari/bin/activate
          python scripts/phase8g-native-safari-smoke.py

      - name: Enable macOS Reduce Motion for native Safari
        run: |
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          killall cfprefsd || true
          sleep 3
          defaults read com.apple.Accessibility ReduceMotionEnabled | tee artifacts/native-safari/reduce-motion-setting.txt

      - name: Run native Safari reduced-motion acceptance
        env:
          BASE_URL: http://127.0.0.1:3100
          SAFARI_ARTIFACT_DIR: artifacts/native-safari
          SAFARI_REDUCED_MOTION_ONLY: "1"
        run: |
          . .venv-safari/bin/activate
          python scripts/phase8g-native-safari-smoke.py

      - name: Collect server log and stop exact candidate
        if: always()
        run: |
          mkdir -p artifacts/native-safari
          if [ -f /tmp/ia-empleado-safari-next.log ]; then
            cp /tmp/ia-empleado-safari-next.log artifacts/native-safari/next-server.log || true
          fi
          if [ -f /tmp/ia-empleado-safari-next.pid ]; then
            kill "$(cat /tmp/ia-empleado-safari-next.pid)" || true
          fi
          defaults delete com.apple.Accessibility ReduceMotionEnabled || true
          defaults delete NSGlobalDomain AppleKeyboardUIMode || true
          defaults delete com.apple.Safari WebKitTabToLinksPreferenceKey || true
          defaults delete com.apple.Safari com.apple.Safari.ContentPageGroupIdentifier.WebKit2TabsToLinks || true
          killall cfprefsd || true

      - name: Upload native Safari evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8g-native-safari-evidence
          path: artifacts/native-safari/
          if-no-files-found: warn
          retention-days: 14
