name: Generate Phase 8D Home Brand Story

on:
  workflow_dispatch:
  push:
    branches:
      - phase8d/home-brand-story
    paths:
      - scripts/render-home-brand-story.py
      - .github/workflows/generate-home-brand-story.yml
      - public/branding/characters/**
      - public/branding/ia-empleado-mark.svg

permissions:
  contents: write

concurrency:
  group: phase8d-home-brand-story-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2
          python -m pip install --disable-pip-version-check pillow cairosvg numpy

      - name: Render 1080p brand story
        run: python scripts/render-home-brand-story.py

      - name: Validate Phase 8D media contract
        run: node scripts/check-brand-video.mjs

      - name: Inspect delivery files
        run: |
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 public/branding/video/home/ia-empleado-brand-story.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 public/branding/video/home/ia-empleado-brand-story.webm
          ls -lh public/branding/video/home/

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding/video/home/ia-empleado-brand-story.mp4 \
                  public/branding/video/home/ia-empleado-brand-story.webm \
                  public/branding/video/home/ia-empleado-brand-story-poster.webp
          if git diff --cached --quiet; then
            echo "Generated assets already match the repository."
            exit 0
          fi
          git commit -m "feat: add Phase 8D homepage brand story media"
          git push origin HEAD:${GITHUB_REF_NAME}
