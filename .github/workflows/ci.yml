name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: EN/ES parity
        run: npm run i18n:check

      - name: Reference employee content contract
        run: node scripts/check-reference-employees.mjs

      - name: Employee discovery contract
        run: node scripts/check-employee-discovery.mjs

      - name: Mobile navigation contract
        run: node scripts/check-mobile-navigation.mjs

      - name: AI Teams content contract
        run: node scripts/check-ai-teams.mjs

      - name: Interactive collaboration contract
        run: node scripts/check-interactive-collaboration.mjs

      - name: Team Builder contract
        run: node scripts/check-team-builder.mjs

      - name: Process Analyzer contract
        run: node scripts/check-process-analyzer.mjs

      - name: ROI Estimator contract
        run: node scripts/check-roi-estimator.mjs

      - name: Comparison surfaces contract
        run: node scripts/check-comparisons.mjs

      - name: Sector and use-case contract
        run: node scripts/check-sector-use-cases.mjs

      - name: Organization map contract
        run: node scripts/check-organization-map.mjs

      - name: Branding system contract
        run: node scripts/check-branding.mjs

      - name: Canonical character image delivery contract
        run: node scripts/check-character-image-delivery.mjs

      - name: Brand motion contract
        run: node scripts/check-brand-motion.mjs

      - name: UX accessibility contract
        run: node scripts/check-ux-accessibility.mjs

      - name: Brand media contract
        run: node scripts/check-brand-media.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Browser UX and accessibility QA
        run: npm run qa:browser

      - name: Upload browser QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
