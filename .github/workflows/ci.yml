name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: EN/ES parity
        run: npm run i18n:check

      - name: Reference employee content contract
        run: node scripts/check-reference-employees.mjs

      - name: Employee discovery contract
        run: node scripts/check-employee-discovery.mjs

      - name: Mobile navigation contract
        run: node scripts/check-mobile-navigation.mjs

      - name: AI Teams content contract
        run: node scripts/check-ai-teams.mjs

      - name: Interactive collaboration contract
        run: node scripts/check-interactive-collaboration.mjs

      - name: Team Builder contract
        run: node scripts/check-team-builder.mjs

      - name: Process Analyzer contract
        run: node scripts/check-process-analyzer.mjs

      - name: ROI Estimator contract
        run: node scripts/check-roi-estimator.mjs

      - name: Comparison surfaces contract
        run: node scripts/check-comparisons.mjs

      - name: Sector and use-case contract
        run: node scripts/check-sector-use-cases.mjs

      - name: Organization map contract
        run: node scripts/check-organization-map.mjs

      - name: Branding system contract
        run: node scripts/check-branding.mjs

      - name: Canonical character image delivery contract
        run: node scripts/check-character-image-delivery.mjs

      - name: Role visual family contract
        run: node scripts/check-role-visual-families.mjs

      - name: Team and Department composition contract
        run: node scripts/check-team-department-compositions.mjs

      - name: Sector hero art contract
        run: node scripts/check-sector-hero-art.mjs

      - name: Brand motion contract
        run: node scripts/check-brand-motion.mjs

      - name: UX accessibility contract
        run: node scripts/check-ux-accessibility.mjs

      - name: Brand media contract
        run: node scripts/check-brand-media.mjs

      - name: Campaign media contract
        run: node scripts/check-campaign-media.mjs

      - name: Conversion handoff contract
        run: node scripts/check-conversion-handoff.mjs

      - name: Contextual result handoff contract
        run: node scripts/check-contextual-result-handoff.mjs

      - name: Lead intake foundation contract
        run: node scripts/check-lead-intake.mjs

      - name: Hostinger SMTP lead delivery contract
        run: node scripts/check-smtp-lead-delivery.mjs

      - name: Phase 8B release gate contract
        run: node scripts/check-phase8-release-gate.mjs

      - name: Phase 8E performance budget contract
        run: node scripts/check-phase8e-performance-budget.mjs

      - name: Phase 8E Lighthouse launch contract
        run: node scripts/check-phase8e-lighthouse.mjs

      - name: Phase 8F SEO foundation contract
        run: node scripts/check-phase8f-seo-foundation.mjs

      - name: Phase 8H commercial readiness pre-audit contract
        run: node scripts/check-phase8h-commercial-readiness.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  chromium-qa:
    name: Chromium browser QA shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser UX and accessibility QA shard ${{ matrix.shard }}/3
        run: npm run qa:browser -- --shard=${{ matrix.shard }}/3

      - name: Upload Chromium shard diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  chromium-phase8g:
    name: Chromium Phase 8G acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Phase 8G 768px stability stress acceptance
        run: npm run qa:phase8g:768

      - name: Phase 8G Android Chromium emulation acceptance
        run: npm run qa:phase8g:android

      - name: Upload Chromium Phase 8G diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-phase8g-report
          path: |
            playwright-phase8g-768-report/
            playwright-phase8g-android-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Phase 8G Firefox smoke acceptance
        run: npm run qa:phase8g:firefox

      - name: Upload Firefox diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firefox-report
          path: |
            playwright-phase8g-firefox-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    name: WebKit browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Phase 8G WebKit smoke acceptance
        run: npm run qa:phase8g:webkit

      - name: Phase 8G iPhone WebKit emulation acceptance
        run: npm run qa:phase8g:iphone

      - name: Upload WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit-report
          path: |
            playwright-phase8g-webkit-report/
            playwright-phase8g-iphone-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  edge:
    name: Microsoft Edge browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Microsoft Edge
        run: npx playwright install --with-deps msedge

      - name: Phase 8G Microsoft Edge smoke acceptance
        run: npm run qa:phase8g:edge

      - name: Upload Edge diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-edge-report
          path: |
            playwright-phase8g-edge-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
