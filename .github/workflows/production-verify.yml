name: Production Verification

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Web Phase 7C1 lead intake foundation on Hostinger
        env:
          PRODUCTION_BASE_URL: https://iaempleado.com
          EXPECTED_RELEASE: web-phase-7c1-lead-intake-foundation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 --max-time 20 "$PRODUCTION_BASE_URL/" || true)"
            if printf '%s' "$html" | grep -q 'ia-web-release' && printf '%s' "$html" | grep -q "$EXPECTED_RELEASE"; then
              echo "Production is serving release marker: $EXPECTED_RELEASE"
              exit 0
            fi
            echo "Attempt $attempt/40: production has not published $EXPECTED_RELEASE yet"
            sleep 15
          done
          echo "Production release marker did not appear within the verification window"
          exit 1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production geometry, brand systems, campaign media, conversion, contextual result handoff, lead intake foundation, responsive UX and accessibility
        env:
          PRODUCTION_BASE_URL: https://iaempleado.com
        run: >-
          npx playwright test
          --config=playwright.production.config.ts
          tests/internal-hero-geometry.spec.ts
          tests/role-visual-families.spec.ts
          tests/team-department-compositions.spec.ts
          tests/sector-hero-art.spec.ts
          tests/campaign-media.spec.ts
          tests/conversion-handoff.spec.ts
          tests/contextual-result-handoff.spec.ts
          tests/lead-intake.spec.ts
          tests/navigation-and-hero-scale.spec.ts
          tests/ux-visual.spec.ts

      - name: Upload production QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
