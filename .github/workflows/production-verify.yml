name: Production Verification

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute exact web release fingerprint
        id: release
        run: echo "fingerprint=$(node scripts/generate-release-fingerprint.mjs --print)" >> "$GITHUB_OUTPUT"

      - name: Wait for exact release fingerprint on Hostinger
        env:
          PRODUCTION_BASE_URL: https://iaempleado.com
          EXPECTED_RELEASE: ${{ steps.release.outputs.fingerprint }}
        run: |
          set -euo pipefail
          echo "Waiting for production release fingerprint: $EXPECTED_RELEASE"
          for attempt in $(seq 1 40); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 --max-time 20 "$PRODUCTION_BASE_URL/" || true)"
            if printf '%s' "$html" | grep -q 'ia-web-release' && printf '%s' "$html" | grep -q "$EXPECTED_RELEASE"; then
              echo "Production is serving exact release fingerprint: $EXPECTED_RELEASE"
              exit 0
            fi
            echo "Attempt $attempt/40: production has not published exact fingerprint $EXPECTED_RELEASE yet"
            sleep 15
          done
          echo "Exact production release fingerprint did not appear within the verification window"
          exit 1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production geometry, brand systems, conversion, accessibility, motion, canonical fidelity, performance, SEO and Phase 8H legal surfaces
        env:
          PRODUCTION_BASE_URL: https://iaempleado.com
        run: >-
          npx playwright test
          --config=playwright.production.config.ts
          tests/internal-hero-geometry.spec.ts
          tests/role-visual-families.spec.ts
          tests/team-department-compositions.spec.ts
          tests/sector-hero-art.spec.ts
          tests/campaign-media.spec.ts
          tests/conversion-handoff.spec.ts
          tests/contextual-result-handoff.spec.ts
          tests/lead-intake.spec.ts
          tests/navigation-and-hero-scale.spec.ts
          tests/phase8-responsive-matrix.spec.ts
          tests/phase8-interaction-ux.spec.ts
          tests/phase8b-accessibility.spec.ts
          tests/phase8b-interaction-accessibility.spec.ts
          tests/phase8c-motion.spec.ts
          tests/phase8d-canonical-visual.spec.ts
          tests/phase8e-performance-budget.spec.ts
          tests/phase8f-seo-runtime.spec.ts
          tests/phase8f-structured-navigation.spec.ts
          tests/phase8h-legal-readiness.spec.ts
          tests/ux-visual.spec.ts

      - name: Build exact release for Lighthouse lab
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Start exact release for Lighthouse lab
        env:
          EXPECTED_RELEASE: ${{ steps.release.outputs.fingerprint }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -euo pipefail
          mkdir -p .artifacts/lighthouse
          nohup npm run start -- -H 127.0.0.1 -p 3000 > .artifacts/lighthouse/server.log 2>&1 &
          echo $! > /tmp/phase8e-lighthouse-next.pid
          for attempt in $(seq 1 30); do
            html="$(curl -fsS --max-time 5 http://127.0.0.1:3000/ || true)"
            if printf '%s' "$html" | grep -q 'ia-web-release' && printf '%s' "$html" | grep -q "$EXPECTED_RELEASE"; then
              echo "Exact release $EXPECTED_RELEASE is ready for WAF-independent Lighthouse lab audit"
              exit 0
            fi
            sleep 2
          done
          echo "Local production server did not become ready with exact release fingerprint $EXPECTED_RELEASE"
          cat .artifacts/lighthouse/server.log || true
          exit 1

      - name: Run Phase 8E Lighthouse launch gate
        env:
          LIGHTHOUSE_BASE_URL: http://127.0.0.1:3000
        run: npm run qa:lighthouse:production

      - name: Stop Lighthouse lab server
        if: always()
        run: |
          if [ -f /tmp/phase8e-lighthouse-next.pid ]; then
            kill "$(cat /tmp/phase8e-lighthouse-next.pid)" 2>/dev/null || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8e-lighthouse-reports
          path: .artifacts/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: |
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
